version: 2

project_name: arsenal

before:
  hooks:
    - go mod tidy

builds:
  - id: arsenal
    main: ./cmd/arsenal
    binary: arsenal
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/edwinupegui/arsenal/internal/cli.Version={{.Version}}
      - -X github.com/edwinupegui/arsenal/internal/cli.Commit={{.ShortCommit}}
      - -X github.com/edwinupegui/arsenal/internal/cli.Date={{.Date}}

archives:
  - id: arsenal
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
      - "^docs"
      - "^test"

release:
  draft: false
  prerelease: auto

# Homebrew tap publication. Requires:
#   1. A repo at github.com/edwinupegui/homebrew-tap (create it once, empty
#      is fine — GoReleaser will commit the formula on the first release).
#   2. A GitHub PAT with `repo` scope exposed to the workflow as
#      HOMEBREW_TAP_GITHUB_TOKEN (the default GITHUB_TOKEN cannot push to a
#      different repository).
brews:
  - name: arsenal
    repository:
      owner: edwinupegui
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/edwinupegui/arsenal
    description: Local-first manager for curated technical resources (CLI + TUI + web)
    license: MIT
    install: |
      bin.install "arsenal"
      generate_completions_from_executable(bin/"arsenal", "completion")
    test: |
      system "#{bin}/arsenal", "version"
    commit_author:
      name: arsenal-release-bot
      email: noreply@github.com
    commit_msg_template: "chore(formula): bump arsenal to {{ .Tag }}"
