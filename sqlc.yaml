version: "2"
sql:
  - engine: "sqlite"
    schema: "internal/migrations"
    queries: "internal/store/queries"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - column: "resources.deleted_at"
            go_type:
              import: "database/sql"
              type: "NullString"
          - column: "resources.description"
            go_type:
              import: "database/sql"
              type: "NullString"
          - column: "resources.notes"
            go_type:
              import: "database/sql"
              type: "NullString"
          - column: "resources.category_id"
            go_type:
              import: "database/sql"
              type: "NullInt64"
          - column: "finance_transactions.deleted_at"
            go_type:
              import: "database/sql"
              type: "NullString"
          - column: "finance_transactions.notes"
            go_type:
              import: "database/sql"
              type: "NullString"
          - column: "finance_transactions.category_id"
            go_type:
              import: "database/sql"
              type: "NullInt64"
