# golangci-lint v2 configuration. Migrated from v1 — see
# https://golangci-lint.run/docs/product/migration-guide/.
version: "2"

run:
  timeout: 3m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gocritic
    - gosec
    - unconvert
    - unparam
  settings:
    errcheck:
      # Skip the call sites that intentionally ignore errors. fmt.Fprint*
      # to a bytes/strings buffer cannot fail; *.Close on cleanup paths
      # is conventionally ignored — failures there are unrecoverable.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf
        - os.Remove
        - os.RemoveAll
        - os.Rename
    revive:
      rules:
        # The closed-enum constant blocks (TypeVideo, LangES, …) carry
        # documentation in the type-level comment; per-constant comments
        # are noise.
        - name: exported
          disabled: true
    gosec:
      excludes:
        # G104 errors are covered by errcheck.
        # G201 / G202: SQL formatting — used only with our own escaped paths.
        # G204 / G702: subprocess with variable — `open url` and $EDITOR shellouts.
        # G301 / G302 / G306: filesystem permissions — defaults match user-expected
        # behavior (markdown export goes to git, dirs/files inherit umask).
        # G304: file inclusion — paths come from our own filesystem walks.
        # G710: open redirect — id/slug values are validated before use.
        - G104
        - G201
        - G202
        - G204
        - G301
        - G302
        - G304
        - G306
        - G702
        - G703
        - G710
    misspell:
      locale: US
      ignore-rules:
        - patrones
        - tendencias
        - adicionales
        - arquitectura
        - seguridad
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
